<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>상하이 여행 일정표</title>
  <style>
    /* 1단계(뼈대): 구조 확인용 최소 스타일. 디자인은 3단계에서 다듬습니다. */
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 17px;
      background: #f4f4f4;
      color: #222;
    }
    #app {
      max-width: 480px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    header { padding: 12px 16px; border-bottom: 1px solid #ddd; }
    header h1 { margin: 0; font-size: 20px; }

    main { flex: 1; overflow-y: auto; }
    .page { display: none; }
    .page.active { display: block; }

    /* 일차 / 필터 탭 줄 */
    .tab-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid #ddd;
    }
    .tab-row button {
      flex: none;
      min-height: 48px;
      padding: 0 14px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: #fff;
    }
    .tab-row button.active { background: #222; color: #fff; border-color: #222; }

    /* 일정 목록 */
    .item-list { list-style: none; margin: 0; padding: 12px 16px; }
    .item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .item .no { font-weight: bold; min-width: 36px; }
    .item .time { font-weight: bold; }
    .item .place { font-size: 15px; color: #666; }
    .empty { padding: 24px 16px; color: #888; text-align: center; }

    .add-btn {
      display: block;
      width: calc(100% - 32px);
      min-height: 48px;
      margin: 0 16px 16px;
      font-size: 17px;
      border: 1px dashed #999;
      border-radius: 8px;
      background: #fafafa;
    }

    /* 지도 */
    #map {
      height: 55vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8e8e8;
      color: #666;
    }

    /* 하단 탭 */
    nav.bottom {
      display: flex;
      border-top: 1px solid #ddd;
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav.bottom button {
      flex: 1;
      min-height: 56px;
      font-size: 17px;
      border: 0;
      background: #fff;
    }
    nav.bottom button.active { font-weight: bold; color: #c62828; }
  </style>
</head>
<body>
  <div id="app">
    <header><h1>상하이 여행</h1></header>

    <main>
      <!-- 일정표 페이지 -->
      <section id="page-schedule" class="page active">
        <div id="day-tabs" class="tab-row"></div>
        <ul id="item-list" class="item-list"></ul>
        <button id="add-item" class="add-btn" type="button">+ 일정 추가</button>
      </section>

      <!-- 지도 페이지 -->
      <section id="page-map" class="page">
        <div id="map-tabs" class="tab-row"></div>
        <div id="map">지도 준비 중</div>
        <ul id="map-list" class="item-list"></ul>
      </section>
    </main>

    <nav class="bottom">
      <button type="button" data-page="schedule" class="active">📋 일정표</button>
      <button type="button" data-page="map">🗺️ 지도</button>
    </nav>
  </div>

  <script>
    // ── 설정 ──────────────────────────────────────────
    // 구글맵 API 키 (2단계에서 사용). 비어 있으면 지도 자리에 "지도 준비 중"을 띄웁니다.
    const GOOGLE_MAPS_API_KEY = '';
    const STORAGE_KEY = 'shanghai-trip-v1';
    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

    // ── 데이터 (PRD 6장) ─────────────────────────────
    // days 배열 순서 = 일차, items 배열 순서 = 일정 순서
    function createInitialTrip() {
      return {
        startDate: '2026-11-30',
        days: [
          {
            items: [
              { id: newId(), time: '10:00', title: '푸동공항 도착', visited: false,
                place: { name: '상하이 푸동 국제공항', lat: 31.1443, lng: 121.8083, placeId: null } },
              { id: newId(), time: '13:00', title: '호텔 체크인', visited: false, place: null },
              { id: newId(), time: '18:00', title: '와이탄 야경', visited: false,
                place: { name: '와이탄 (The Bund)', lat: 31.2400, lng: 121.4900, placeId: null } },
            ],
          },
        ],
      };
    }

    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    // ── 저장 / 불러오기 (localStorage) ───────────────
    function loadTrip() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {
        console.warn('저장된 일정을 불러오지 못했습니다.', e);
      }
      return createInitialTrip();
    }

    function saveTrip() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(trip));
      } catch (e) {
        console.warn('일정을 저장하지 못했습니다.', e);
      }
    }

    // ── 화면 상태 (저장하지 않음) ─────────────────────
    let trip = loadTrip();
    saveTrip(); // 처음 연 경우 초기 데이터를 저장해 둡니다.
    const ui = {
      page: 'schedule', // 'schedule' | 'map'
      day: 0,           // 일정표에서 보고 있는 일차 (0부터)
      mapFilter: 'all', // 'all' | 일차 번호(0부터)
    };

    // ── 도우미 ───────────────────────────────────────
    // n일차(0부터)의 날짜 라벨. 예: "11/30(월)"
    function dayDateLabel(dayIndex) {
      const [y, m, d] = trip.startDate.split('-').map(Number);
      const date = new Date(y, m - 1, d + dayIndex);
      return `${date.getMonth() + 1}/${date.getDate()}(${WEEKDAYS[date.getDay()]})`;
    }

    // 일정 번호. 예: 1일차 두 번째 일정 → "1-2"
    function itemNo(dayIndex, itemIndex) {
      return `${dayIndex + 1}-${itemIndex + 1}`;
    }

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.assign(node, props);
      for (const child of [].concat(children)) {
        if (child != null) node.append(child);
      }
      return node;
    }

    // ── 그리기 ───────────────────────────────────────
    function render() {
      renderPage();
      renderDayTabs();
      renderItems();
      renderMapTabs();
      renderMapList();
    }

    function renderPage() {
      document.querySelectorAll('.page').forEach((p) => {
        p.classList.toggle('active', p.id === `page-${ui.page}`);
      });
      document.querySelectorAll('nav.bottom button').forEach((b) => {
        b.classList.toggle('active', b.dataset.page === ui.page);
      });
    }

    function renderDayTabs() {
      const row = document.getElementById('day-tabs');
      row.replaceChildren(
        ...trip.days.map((_, i) => el('button', {
          type: 'button',
          className: i === ui.day ? 'active' : '',
          textContent: `${i + 1}일차 · ${dayDateLabel(i)}`,
          onclick: () => { ui.day = i; render(); },
        })),
        // 2단계(F1)에서 동작을 붙입니다.
        el('button', { type: 'button', textContent: '+ 일차 추가', disabled: true }),
      );
    }

    function renderItems() {
      const list = document.getElementById('item-list');
      const items = trip.days[ui.day].items;
      if (items.length === 0) {
        list.replaceChildren(el('li', { className: 'empty', textContent: '아직 일정이 없어요.' }));
        return;
      }
      list.replaceChildren(...items.map((item, i) => el('li', { className: 'item' }, [
        el('span', { className: 'no', textContent: itemNo(ui.day, i) }),
        el('div', {}, [
          el('div', { className: 'time', textContent: item.time }),
          el('div', { textContent: item.title }),
          item.place ? el('div', { className: 'place', textContent: `📍 ${item.place.name}` }) : null,
        ]),
      ])));
    }

    function renderMapTabs() {
      const row = document.getElementById('map-tabs');
      const filters = ['all', ...trip.days.map((_, i) => i)];
      row.replaceChildren(...filters.map((f) => el('button', {
        type: 'button',
        className: f === ui.mapFilter ? 'active' : '',
        textContent: f === 'all' ? '전체' : `${f + 1}일차`,
        onclick: () => { ui.mapFilter = f; render(); },
      })));
    }

    // 지도 아래 장소 목록 (지도가 안 뜰 때도 마크한 장소를 확인할 수 있게)
    function renderMapList() {
      const list = document.getElementById('map-list');
      const rows = [];
      trip.days.forEach((day, d) => {
        if (ui.mapFilter !== 'all' && ui.mapFilter !== d) return;
        day.items.forEach((item, i) => {
          if (item.place) rows.push({ no: itemNo(d, i), item });
        });
      });
      if (rows.length === 0) {
        list.replaceChildren(el('li', { className: 'empty', textContent: '표시한 장소가 없어요.' }));
        return;
      }
      list.replaceChildren(...rows.map(({ no, item }) => el('li', { className: 'item' }, [
        el('span', { className: 'no', textContent: no }),
        el('div', {}, [
          el('div', { textContent: item.place.name }),
          el('div', { className: 'place', textContent: `${item.time} · ${item.title}` }),
        ]),
      ])));
    }

    // ── 이벤트 ───────────────────────────────────────
    document.querySelectorAll('nav.bottom button').forEach((b) => {
      b.addEventListener('click', () => { ui.page = b.dataset.page; render(); });
    });

    // 2단계(F2)에서 입력 칸을 붙입니다.
    document.getElementById('add-item').addEventListener('click', () => {
      alert('일정 추가는 2단계에서 만듭니다.');
    });

    render();
  </script>
</body>
</html>
