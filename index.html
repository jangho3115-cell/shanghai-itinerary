<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <!-- 홈 화면에 추가했을 때 앱처럼 보이기 (F11). 아이콘은 아래 스크립트가 그려 넣습니다. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="상하이 여행">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234154FF'/%3E%3Cpath d='M32 13c-8.3 0-15 6.5-15 14.6C17 38.5 32 52 32 52s15-13.5 15-24.4C47 19.5 40.3 13 32 13z' fill='%23fff'/%3E%3Ccircle cx='32' cy='28' r='6' fill='%234154FF'/%3E%3C/svg%3E">
  <title>상하이 여행 일정표</title>
  <!-- 글꼴: Pretendard. 불러오지 못하면 휴대폰 기본 글꼴로 보입니다. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    /* ── 디자인 토큰 ──────────────────────────────────
       흰 바탕 + 절제된 파랑, 1px 연한 테두리, 둥근 모서리.
       부모님이 쓰시므로 글자·터치 영역은 크게 잡았습니다. */
    :root {
      --primary: #4154FF;          /* 버튼·포커스·선택 강조 */
      --primary-press: #2432AD;    /* 눌렀을 때 */
      --primary-weak: #F5F6FF;     /* 파랑 연한 면 */
      --primary-weak1: #DFE2FF;
      --danger: #E5000F;           /* 삭제 */
      --danger-weak: #FEF5F5;
      --text: #1B1C1F;             /* 본문 글자, 선택된 탭 */
      --text-sub: #6E6F73;         /* 보조 글자 */
      --text-weak: #8B8D92;        /* 안내 글자 */
      --text-disabled: #B6B7BB;
      --line: #DADBDF;             /* 입력·카드 테두리 */
      --line-weak: #E9EAEF;        /* 구분선 */
      --line-weaker: #F2F3F7;
      --surface: #FFFFFF;
      --surface-weak: #F7F8FB;     /* 연한 면 */
      --scrim: rgba(0, 0, 0, .5);
      --shadow-float: 0 0 8px rgba(0, 0, 0, .1);
      --shadow-raise: 0 0 6px rgba(0, 0, 0, .2);
      --radius-s: 12px;
      --radius-m: 16px;
      --radius-l: 28px;
      --radius-pill: 9999px;
      --gutter: 16px;
      --ease: cubic-bezier(.33, 1, .68, 1);
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.45;
      color: var(--text);
      background: var(--surface-weak);
      -webkit-text-size-adjust: 100%;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    button:disabled { cursor: default; color: var(--text-disabled); }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    svg.icon { width: 22px; height: 22px; flex: none; }

    #app {
      position: relative;
      max-width: 480px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      overflow: hidden;
    }
    @media (min-width: 481px) {
      #app { border-left: 1px solid var(--line-weak); border-right: 1px solid var(--line-weak); }
    }

    /* ── 머리글 ── */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: calc(12px + env(safe-area-inset-top)) var(--gutter) 8px;
    }
    header .titles { flex: 1; min-width: 0; }
    header .eyebrow { margin: 0; font-size: 14px; font-weight: 600; color: var(--primary); }
    header h1 { margin: 2px 0 0; font-size: 24px; font-weight: 700; line-height: 1.2; }
    .chip-btn {
      min-height: 40px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      background: var(--surface);
      white-space: nowrap;
    }
    .chip-btn:active { background: var(--line-weaker); }

    main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .page { display: none; min-height: 100%; flex-direction: column; }
    .page.active { display: flex; }

    /* ── 일차 / 필터 탭 (알약형, 선택은 검정) ── */
    .tab-row {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 8px;
      padding: 8px var(--gutter) 12px;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--surface);
      border-bottom: 1px solid var(--line-weaker);
    }
    .tab-row::-webkit-scrollbar { display: none; }
    .tab {
      flex: none;
      min-height: 48px;
      padding: 6px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-pill);
      background: var(--surface-weak);
      color: var(--text-sub);
      transition: background-color .15s ease, color .15s ease;
    }
    .tab .t1 { font-size: 16px; font-weight: 700; line-height: 1.2; display: flex; align-items: center; gap: 6px; }
    .tab .t2 { font-size: 13px; line-height: 1.2; }
    .tab .dot { width: 8px; height: 8px; border-radius: 50%; }
    .tab.active { background: var(--text); color: #fff; }
    .tab.add {
      flex-direction: row;
      gap: 4px;
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-weak);
      border: 1px dashed var(--primary-weak1);
    }

    /* ── 일차 요약 ── */
    .day-head { padding: 20px var(--gutter) 4px; }
    .day-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
    .day-head p { margin: 4px 0 0; font-size: 15px; color: var(--text-sub); }
    .section-title { margin: 0; padding: 20px var(--gutter) 4px; font-size: 18px; font-weight: 700; }

    /* ── 일정 카드 ── */
    .item-list { list-style: none; margin: 0; padding: 12px var(--gutter); display: flex; flex-direction: column; gap: 12px; }
    .item {
      border: 1px solid var(--line);
      border-radius: var(--radius-m);
      background: var(--surface);
      overflow: hidden;
      transition: box-shadow .15s ease, transform .15s var(--ease);
    }
    .item.dragging { box-shadow: var(--shadow-raise); transform: scale(1.02); border-color: var(--primary); position: relative; z-index: 1; }
    .item .main { display: flex; align-items: stretch; }
    .item .handle {
      flex: none;
      width: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-disabled);
      touch-action: none; /* 끌기 중 화면 스크롤 방지 */
      cursor: grab;
    }
    .item .body {
      flex: 1;
      min-width: 0;
      display: flex;
      gap: 12px;
      padding: 16px 0;
      text-align: left;
    }
    .no-badge {
      flex: none;
      align-self: flex-start;
      min-width: 40px;
      height: 28px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .item .text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .item .time { font-size: 20px; font-weight: 700; line-height: 1.2; }
    .item .time.none { font-size: 16px; color: var(--text-weak); }
    .item .title { font-size: 18px; font-weight: 500; word-break: keep-all; overflow-wrap: anywhere; }
    .item .place { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 15px; color: var(--text-sub); }
    .item .place svg { width: 16px; height: 16px; }
    .item .place.none { color: var(--primary); font-weight: 600; }
    .item .check {
      flex: none;
      width: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-sub);
    }
    .item .check .circle {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--line);
      border-radius: 50%;
      color: transparent;
      transition: background-color .15s ease, border-color .15s ease;
    }
    .item .check .circle svg { width: 20px; height: 20px; }
    .item.visited .check .circle { background: var(--primary); border-color: var(--primary); color: #fff; }
    .item.visited .check { color: var(--primary); font-weight: 700; }
    .item.visited .body { opacity: .5; }
    .item.visited .title { text-decoration: line-through; }
    .item .actions { display: flex; border-top: 1px solid var(--line-weaker); }
    .item .actions button {
      flex: 1;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-sub);
    }
    .item .actions button:not(:disabled):active { background: var(--line-weaker); }
    .item .actions button + button { border-left: 1px solid var(--line-weaker); }
    .item .actions .danger { color: var(--danger); }
    .item .actions svg { width: 20px; height: 20px; }

    /* 지도 페이지의 장소 목록 (작은 카드) */
    .place-row .body { padding: 14px 16px; }
    .place-row .title { font-size: 17px; font-weight: 600; }
    .place-row .meta { font-size: 14px; color: var(--text-sub); }
    .place-row .go { flex: none; display: flex; align-items: center; padding-right: 12px; color: var(--text-disabled); }

    /* ── 일정 입력 칸 ── */
    .item.editing { border: 1.5px solid var(--primary); }
    .item-form { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .item-form .form-title { margin: 0; font-size: 17px; font-weight: 700; }
    .item-form label { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600; color: var(--text-sub); }
    .item-form input {
      width: 100%;
      min-height: 52px;
      padding: 0 16px;
      font-size: 18px;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: var(--radius-m);
      background: var(--surface);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .item-form input:focus { border: 1.5px solid var(--primary); }
    .item-form input::placeholder { color: var(--text-weak); }
    .btn-row { display: flex; gap: 8px; }
    .btn {
      flex: 1;
      min-height: 52px;
      padding: 0 16px;
      border-radius: var(--radius-m);
      font-size: 17px;
      font-weight: 700;
      border: 1px solid var(--line);
      background: var(--surface);
      transition: background-color .15s ease;
    }
    .btn:not(:disabled):active { background: var(--line-weaker); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:not(:disabled):active { background: var(--primary-press); }
    .btn.primary:disabled { background: var(--line); border-color: var(--line); color: #fff; }
    .btn.danger-line { color: var(--danger); }
    .btn.danger-line:disabled { color: var(--text-disabled); }

    /* ── 빈 상태 ── */
    .empty {
      margin: 8px 0;
      padding: 32px 16px;
      text-align: center;
      font-size: 16px;
      color: var(--text-sub);
      background: var(--surface-weak);
      border-radius: var(--radius-m);
    }
    .empty strong { display: block; margin-bottom: 4px; font-size: 17px; color: var(--text); }

    /* ── 화면 아래쪽 고정 '+ 일정 추가' (엄지가 닿는 자리) ── */
    .sticky-bottom {
      position: sticky;
      bottom: 0;
      margin-top: auto;
      padding: 12px var(--gutter);
      background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 30%);
    }
    .sticky-bottom .btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .remove-day {
      display: block;
      margin: 4px auto 8px;
      min-height: 44px;
      padding: 0 16px;
      font-size: 15px;
      color: var(--text-weak);
      text-decoration: underline;
    }

    /* ── 지도 ── */
    .map-box { position: relative; height: 52vh; min-height: 280px; background: var(--line-weaker); }
    .map-box .map { position: absolute; inset: 0; }
    .map-msg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
      text-align: center;
      font-size: 16px;
      color: var(--text-sub);
      background: var(--surface-weak);
      white-space: pre-line;
    }
    .map-msg svg { width: 40px; height: 40px; color: var(--text-disabled); }

    /* 지도 마커: 1-1, 12-10처럼 긴 번호도 들어가는 알약형 */
    .marker {
      min-width: 36px;
      height: 32px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      border-radius: var(--radius-pill);
      font: 700 14px/1 var(--font);
      color: #fff;
      white-space: nowrap;
      box-shadow: var(--shadow-raise);
    }
    .marker.visited { opacity: .5; }
    .marker.pick { height: 36px; font-size: 15px; background: var(--primary); }
    .info { font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--text); max-width: 240px; }
    .info .info-title { font-size: 16px; font-weight: 700; }
    .info .info-place { color: var(--text-sub); }
    .info a {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      margin-top: 8px;
      padding: 0 14px;
      border-radius: var(--radius-s);
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    /* ── 장소 고르기 바텀시트 ── */
    #picker {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: var(--scrim);
      animation: fadeIn .2s ease;
    }
    #picker .sheet {
      height: calc(100% - 24px - env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: var(--radius-l) var(--radius-l) 0 0;
      overflow: hidden;
      animation: slideUp .3s var(--ease);
    }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes slideUp { from { transform: translateY(100%); } }
    #picker .grabber { width: 40px; height: 4px; margin: 8px auto 0; border-radius: 2px; background: var(--line); }
    #picker .top { display: flex; align-items: center; gap: 8px; padding: 4px 8px 0 20px; }
    #picker .top .titles { flex: 1; min-width: 0; }
    #picker .top .eyebrow { margin: 0; font-size: 14px; font-weight: 700; }
    #picker .top h2 { margin: 0; font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #picker .close { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-s); }
    #picker .close:active { background: var(--line-weaker); }
    #picker-search { padding: 12px var(--gutter); }
    #picker-search gmp-place-autocomplete {
      width: 100%;
      color-scheme: light;
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }
    #picker .hint { margin: 0; padding: 0 var(--gutter) 8px; font-size: 14px; color: var(--text-sub); }
    #picker .map-box { flex: 1; height: auto; min-height: 0; }
    #picker .bottom {
      padding: 12px var(--gutter) calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line-weak);
      box-shadow: var(--shadow-float);
    }
    #picker-chosen {
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      color: var(--text-sub);
    }
    #picker-chosen.has { color: var(--text); font-weight: 700; }
    #picker-chosen svg { width: 20px; height: 20px; color: var(--primary); }
    #picker .bottom .btn.primary { flex: 2; }

    /* ── 하단 탭 (선택은 굵기와 검정으로) ── */
    nav.bottom {
      position: relative;
      z-index: 3;
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--surface);
      border-top: 1px solid rgba(0, 0, 0, .05);
      box-shadow: var(--shadow-float);
    }
    nav.bottom button {
      flex: 1;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 14px;
      color: var(--text-sub);
    }
    nav.bottom button svg { width: 26px; height: 26px; }
    nav.bottom button.active { color: var(--text); font-weight: 700; }

    /* ── 알림 (토스트) ── */
    #toast {
      position: absolute;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom));
      z-index: 30;
      transform: translate(-50%, 8px);
      max-width: calc(100% - 32px);
      padding: 12px 20px;
      border-radius: var(--radius-pill);
      background: var(--text);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s var(--ease);
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="titles">
        <p id="trip-sub" class="eyebrow"></p>
        <h1>상하이 여행</h1>
      </div>
      <button id="export-btn" class="chip-btn" type="button">백업 저장</button>
      <button id="import-btn" class="chip-btn" type="button">불러오기</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </header>

    <main>
      <!-- 일정표 페이지 -->
      <section id="page-schedule" class="page active">
        <div id="day-tabs" class="tab-row"></div>
        <div class="day-head">
          <h2 id="day-title"></h2>
          <p id="day-summary"></p>
        </div>
        <ul id="item-list" class="item-list"></ul>
        <button id="remove-day" class="remove-day" type="button" hidden></button>
        <div class="sticky-bottom">
          <button id="add-item" class="btn primary" type="button"></button>
        </div>
      </section>

      <!-- 지도 페이지 -->
      <section id="page-map" class="page">
        <div id="map-tabs" class="tab-row"></div>
        <div class="map-box">
          <div id="main-map" class="map"></div>
          <div id="main-map-msg" class="map-msg"></div>
        </div>
        <h2 id="map-list-title" class="section-title"></h2>
        <ul id="map-list" class="item-list"></ul>
      </section>
    </main>

    <nav class="bottom">
      <button type="button" data-page="schedule" class="active"></button>
      <button type="button" data-page="map"></button>
    </nav>

    <!-- 장소 고르기 바텀시트 (일정 카드를 누르면 열림) -->
    <div id="picker" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="picker-title">
        <div class="grabber"></div>
        <div class="top">
          <div class="titles">
            <p id="picker-eyebrow" class="eyebrow"></p>
            <h2 id="picker-title"></h2>
          </div>
          <button id="picker-close" class="close" type="button" aria-label="닫기"></button>
        </div>
        <div id="picker-search"></div>
        <p class="hint">검색하거나, 지도에서 원하는 곳을 눌러 고르세요.</p>
        <div class="map-box">
          <div id="picker-map" class="map"></div>
          <div id="picker-map-msg" class="map-msg"></div>
        </div>
        <div class="bottom">
          <p id="picker-chosen"></p>
          <div class="btn-row">
            <button id="picker-clear" class="btn danger-line" type="button">장소 지우기</button>
            <button id="picker-save" class="btn primary" type="button">이 장소로 표시</button>
          </div>
        </div>
      </section>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    // ── 설정 ──────────────────────────────────────────
    // 구글맵 API 키. 비어 있으면 지도 자리에 "지도 준비 중"을 띄웁니다.
    // 이 키는 구글 클라우드 콘솔에서 github.io 주소와 localhost에서만 쓰도록 제한되어 있습니다.
    const GOOGLE_MAPS_API_KEY = 'AIzaSyCPGY9pAFHBSnPHMDIOQM8tTVWpCAZd1PY';
    const STORAGE_KEY = 'shanghai-trip-v1';
    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    const SHANGHAI = { lat: 31.2304, lng: 121.4737 };
    // 일차별 색 (일정 번호 배지, 지도 마커·동선에 같이 씀). 일차가 더 많으면 처음부터 반복합니다.
    const DAY_COLORS = ['#4154FF', '#008161', '#CC4100', '#8249D8', '#0B7FB5', '#C2185B', '#996500', '#1B1C1F'];

    // 아이콘 (고정 SVG 문자열)
    const ICONS = {
      list: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
      map: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>',
      pin: '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7.5 7.5 0 0 0-7.5 7.5C4.5 15 12 22 12 22s7.5-7 7.5-12.5A7.5 7.5 0 0 0 12 2zm0 10.2a2.7 2.7 0 1 1 0-5.4 2.7 2.7 0 0 1 0 5.4z"/></svg>',
      check: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
      grip: '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>',
      up: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
      down: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
      plus: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
      close: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
      chevron: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
    };

    // ── 데이터 (PRD 6장) ─────────────────────────────
    // days 배열 순서 = 일차, items 배열 순서 = 일정 순서
    function createInitialTrip() {
      return {
        startDate: '2026-11-30',
        days: [
          {
            items: [
              { id: newId(), time: '10:00', title: '푸동공항 도착', visited: false,
                place: { name: '상하이 푸동 국제공항', lat: 31.1443, lng: 121.8083, placeId: null } },
              { id: newId(), time: '13:00', title: '호텔 체크인', visited: false, place: null },
              { id: newId(), time: '18:00', title: '와이탄 야경', visited: false,
                place: { name: '와이탄 (The Bund)', lat: 31.2400, lng: 121.4900, placeId: null } },
            ],
          },
        ],
      };
    }

    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function isValidTrip(t) {
      return t && typeof t.startDate === 'string' && Array.isArray(t.days) && t.days.length > 0
        && t.days.every((d) => d && Array.isArray(d.items)
          && d.items.every((it) => it && typeof it.id === 'string' && typeof it.title === 'string'));
    }

    // ── 저장 / 불러오기 (localStorage) ───────────────
    function loadTrip() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (isValidTrip(saved)) return saved;
      } catch (e) {
        console.warn('저장된 일정을 불러오지 못했습니다.', e);
      }
      return createInitialTrip();
    }

    function saveTrip() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(trip));
      } catch (e) {
        console.warn('일정을 저장하지 못했습니다.', e);
      }
    }

    // 데이터를 바꾼 뒤에는 항상 이 함수로 저장하고 다시 그립니다.
    function commit(message) {
      saveTrip();
      render();
      if (message) toast(message);
    }

    // ── 화면 상태 (저장하지 않음) ─────────────────────
    let trip = loadTrip();
    saveTrip(); // 처음 연 경우 초기 데이터를 저장해 둡니다.
    const ui = {
      page: 'schedule', // 'schedule' | 'map'
      day: 0,           // 일정표에서 보고 있는 일차 (0부터)
      mapFilter: 'all', // 'all' | 일차 번호(0부터)
      editingId: null,  // 수정 중인 일정 id, 새 일정 입력 중이면 'new'
    };

    // ── 도우미 ───────────────────────────────────────
    function dayDate(dayIndex) {
      const [y, m, d] = trip.startDate.split('-').map(Number);
      return new Date(y, m - 1, d + dayIndex);
    }
    // 예: "11/30(월)"
    function dayDateLabel(dayIndex) {
      const date = dayDate(dayIndex);
      return `${date.getMonth() + 1}/${date.getDate()}(${WEEKDAYS[date.getDay()]})`;
    }
    // 예: "11월 30일 월요일"
    function dayDateLong(dayIndex) {
      const date = dayDate(dayIndex);
      return `${date.getMonth() + 1}월 ${date.getDate()}일 ${WEEKDAYS[date.getDay()]}요일`;
    }

    // 일정 번호. 예: 1일차 두 번째 일정 → "1-2"
    function itemNo(dayIndex, itemIndex) {
      return `${dayIndex + 1}-${itemIndex + 1}`;
    }

    function dayColor(dayIndex) {
      return DAY_COLORS[dayIndex % DAY_COLORS.length];
    }

    function findItem(id) {
      for (let d = 0; d < trip.days.length; d++) {
        const i = trip.days[d].items.findIndex((it) => it.id === id);
        if (i !== -1) return { d, i, item: trip.days[d].items[i] };
      }
      return null;
    }

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (k === 'dataset') Object.assign(node.dataset, v);
        else if (k === 'style') Object.assign(node.style, v);
        else if (k.includes('-')) node.setAttribute(k, v); // aria-label 등
        else node[k] = v;
      }
      for (const child of [].concat(children)) {
        if (child != null) node.append(child);
      }
      return node;
    }

    // 고정 아이콘 SVG를 노드로
    function icon(name) {
      const t = document.createElement('template');
      t.innerHTML = ICONS[name];
      return t.content.firstChild;
    }

    function noBadge(text, dayIndex) {
      return el('span', { className: 'no-badge', textContent: text, style: { background: dayColor(dayIndex) } });
    }

    let toastTimer;
    function toast(message) {
      const box = document.getElementById('toast');
      box.textContent = message;
      box.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => box.classList.remove('show'), 1800);
    }

    // ── 그리기 ───────────────────────────────────────
    function render() {
      renderHeader();
      renderPage();
      renderDayTabs();
      renderDayHead();
      renderItems();
      renderMapTabs();
      renderMapList();
      renderMainMap();
    }

    function renderHeader() {
      document.getElementById('trip-sub').textContent =
        `${dayDateLabel(0)} 출발 · ${trip.days.length}일 일정`;
    }

    function renderPage() {
      document.querySelectorAll('.page').forEach((p) => {
        p.classList.toggle('active', p.id === `page-${ui.page}`);
      });
      document.querySelectorAll('nav.bottom button').forEach((b) => {
        b.classList.toggle('active', b.dataset.page === ui.page);
        b.setAttribute('aria-current', b.dataset.page === ui.page ? 'page' : 'false');
      });
    }

    // F1: 일차 탭
    function renderDayTabs() {
      const row = document.getElementById('day-tabs');
      row.replaceChildren(
        ...trip.days.map((_, i) => el('button', {
          type: 'button',
          className: `tab${i === ui.day ? ' active' : ''}`,
          onclick: () => { ui.day = i; ui.editingId = null; render(); },
        }, [
          el('span', { className: 't1', textContent: `${i + 1}일차` }),
          el('span', { className: 't2', textContent: dayDateLabel(i) }),
        ])),
        el('button', { type: 'button', className: 'tab add', onclick: addDay }, [icon('plus'), '일차 추가']),
      );
      row.children[ui.day]?.scrollIntoView({ block: 'nearest', inline: 'nearest' });

      // 마지막 일차만 삭제할 수 있습니다 (중간을 지우면 뒤 날짜가 모두 바뀌기 때문).
      const isLast = ui.day === trip.days.length - 1;
      const removeBtn = document.getElementById('remove-day');
      removeBtn.hidden = !(isLast && trip.days.length > 1);
      removeBtn.textContent = `${ui.day + 1}일차 삭제하기`;
    }

    function renderDayHead() {
      const items = trip.days[ui.day].items;
      const visited = items.filter((it) => it.visited).length;
      document.getElementById('day-title').textContent = `${ui.day + 1}일차 · ${dayDateLong(ui.day)}`;
      document.getElementById('day-summary').textContent = items.length
        ? `일정 ${items.length}개 · 다녀온 곳 ${visited}개`
        : '아직 일정이 없어요';
    }

    function addDay() {
      trip.days.push({ items: [] });
      ui.day = trip.days.length - 1;
      ui.editingId = null;
      commit(`${ui.day + 1}일차를 추가했어요`);
    }

    function removeLastDay() {
      const last = trip.days.length - 1;
      const count = trip.days[last].items.length;
      const msg = count > 0
        ? `${last + 1}일차와 그 안의 일정 ${count}개를 모두 지울까요?`
        : `${last + 1}일차를 지울까요?`;
      if (!confirm(msg)) return;
      trip.days.pop();
      ui.day = trip.days.length - 1;
      if (ui.mapFilter !== 'all' && ui.mapFilter >= trip.days.length) ui.mapFilter = 'all';
      commit(`${last + 1}일차를 지웠어요`);
    }

    // F2·F3·F7: 일정 카드 목록
    function renderItems() {
      const list = document.getElementById('item-list');
      const items = trip.days[ui.day].items;
      const nodes = items.map((item, i) => (ui.editingId === item.id
        ? el('li', { className: 'item editing' }, itemForm(item, itemNo(ui.day, i)))
        : itemCard(item, i, items.length)));
      if (ui.editingId === 'new') {
        nodes.push(el('li', { className: 'item editing' }, itemForm(null, itemNo(ui.day, items.length))));
      }
      if (nodes.length === 0) {
        nodes.push(el('li', { className: 'empty' }, [
          el('strong', { textContent: '아직 일정이 없어요' }),
          '아래 + 일정 추가를 눌러보세요.',
        ]));
      }
      list.replaceChildren(...nodes);

      const addBtn = document.getElementById('add-item');
      addBtn.replaceChildren(icon('plus'), `${ui.day + 1}일차 일정 추가`);
      addBtn.parentElement.hidden = ui.editingId !== null;

      const firstInput = list.querySelector('.item-form input');
      if (firstInput) {
        firstInput.focus({ preventScroll: true });
        firstInput.closest('.item').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    function itemCard(item, i, total) {
      return el('li', { className: `item${item.visited ? ' visited' : ''}`, dataset: { id: item.id } }, [
        el('div', { className: 'main' }, [
          el('span', {
            className: 'handle',
            title: '끌어서 순서 바꾸기',
            'aria-hidden': 'true',
            onpointerdown: (e) => startDrag(e, item.id),
          }, icon('grip')),
          // 카드를 누르면 구글맵에서 장소를 고릅니다 (F4).
          el('button', { type: 'button', className: 'body', onclick: () => openPicker(item.id) }, [
            noBadge(itemNo(ui.day, i), ui.day),
            el('span', { className: 'text' }, [
              el('span', { className: `time${item.time ? '' : ' none'}`, textContent: item.time || '시간 미정' }),
              el('span', { className: 'title', textContent: item.title }),
              item.place
                ? el('span', { className: 'place' }, [icon('pin'), item.place.name])
                : el('span', { className: 'place none' }, [icon('pin'), '눌러서 장소 표시하기']),
            ]),
          ]),
          el('button', {
            type: 'button',
            className: 'check',
            'aria-pressed': String(!!item.visited),
            onclick: () => {
              item.visited = !item.visited;
              commit(item.visited ? '다녀온 곳으로 표시했어요' : '다녀옴 표시를 지웠어요');
            },
          }, [
            el('span', { className: 'circle' }, icon('check')),
            '다녀옴',
          ]),
        ]),
        el('div', { className: 'actions' }, [
          el('button', { type: 'button', 'aria-label': '위로 옮기기', disabled: i === 0, onclick: () => moveItem(i, -1) }, [icon('up'), '위로']),
          el('button', { type: 'button', 'aria-label': '아래로 옮기기', disabled: i === total - 1, onclick: () => moveItem(i, 1) }, [icon('down'), '아래로']),
          el('button', { type: 'button', textContent: '수정', onclick: () => { ui.editingId = item.id; render(); } }),
          el('button', { type: 'button', className: 'danger', textContent: '삭제', onclick: () => deleteItem(i) }),
        ]),
      ]);
    }

    // 일정 입력 칸 (새 일정이면 item = null)
    function itemForm(item, no) {
      const timeInput = el('input', { type: 'time', value: item?.time || '' });
      const titleInput = el('input', { type: 'text', value: item?.title || '', placeholder: '예: 예원 구경', enterKeyHint: 'done' });
      const save = () => {
        const title = titleInput.value.trim();
        if (!title) { alert('할 일을 적어 주세요.'); titleInput.focus(); return; }
        if (item) {
          item.time = timeInput.value;
          item.title = title;
        } else {
          trip.days[ui.day].items.push({ id: newId(), time: timeInput.value, title, visited: false, place: null });
        }
        ui.editingId = null;
        commit(item ? '일정을 고쳤어요' : '일정을 추가했어요');
      };
      titleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
      return el('div', { className: 'item-form' }, [
        el('p', { className: 'form-title' }, [noBadge(no, ui.day), item ? '  일정 고치기' : '  새 일정']),
        el('label', {}, ['시간', timeInput]),
        el('label', {}, ['할 일', titleInput]),
        el('div', { className: 'btn-row' }, [
          el('button', { type: 'button', className: 'btn', textContent: '취소', onclick: () => { ui.editingId = null; render(); } }),
          el('button', { type: 'button', className: 'btn primary', textContent: '저장', onclick: save }),
        ]),
      ]);
    }

    function moveItem(i, delta) {
      const items = trip.days[ui.day].items;
      const j = i + delta;
      if (j < 0 || j >= items.length) return;
      [items[i], items[j]] = [items[j], items[i]];
      commit();
    }

    function deleteItem(i) {
      const items = trip.days[ui.day].items;
      if (!confirm(`"${items[i].title}" 일정을 지울까요?`)) return;
      items.splice(i, 1);
      commit('일정을 지웠어요');
    }

    // F3: 손잡이를 눌러 끌어서 순서 바꾸기 (손가락·마우스 모두)
    function startDrag(e, id) {
      if (ui.editingId) return;
      e.preventDefault();
      const list = document.getElementById('item-list');
      const card = list.querySelector(`[data-id="${id}"]`);
      const scroller = document.querySelector('main');
      const before = [...list.querySelectorAll('.item')].map((n) => n.dataset.id).join();
      card.classList.add('dragging');
      // 카드를 옮기면 포인터 캡처가 풀리므로, 움직임·손 떼기는 window에서 받습니다.

      let lastY = e.clientY;
      let autoScroll = 0;
      const tick = setInterval(() => { if (autoScroll) { scroller.scrollTop += autoScroll; moveTo(lastY); } }, 16);

      function moveTo(y) {
        const others = [...list.querySelectorAll('.item:not(.dragging)')];
        const next = others.find((o) => {
          const r = o.getBoundingClientRect();
          return y < r.top + r.height / 2;
        });
        if (next) list.insertBefore(card, next);
        else list.append(card);
      }
      function onMove(ev) {
        if (ev.pointerId !== e.pointerId) return;
        lastY = ev.clientY;
        moveTo(lastY);
        const r = scroller.getBoundingClientRect();
        autoScroll = lastY < r.top + 80 ? -8 : lastY > r.bottom - 100 ? 8 : 0;
      }
      function onUp(ev) {
        if (ev.pointerId !== e.pointerId) return;
        clearInterval(tick);
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        const order = [...list.querySelectorAll('.item')].map((n) => n.dataset.id);
        const items = trip.days[ui.day].items;
        items.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
        commit(order.join() !== before ? '순서를 바꿨어요' : null);
      }
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }

    // ── 지도 페이지 (F5·F8·F9) ───────────────────────
    function renderMapTabs() {
      const row = document.getElementById('map-tabs');
      const filters = ['all', ...trip.days.map((_, i) => i)];
      row.replaceChildren(...filters.map((f) => el('button', {
        type: 'button',
        className: `tab${f === ui.mapFilter ? ' active' : ''}`,
        onclick: () => { ui.mapFilter = f; render(); fitMainMap(); },
      }, f === 'all'
        ? [el('span', { className: 't1', textContent: '전체' })]
        : [
          el('span', { className: 't1' }, [el('span', { className: 'dot', style: { background: dayColor(f) } }), `${f + 1}일차`]),
          el('span', { className: 't2', textContent: dayDateLabel(f) }),
        ])));
    }

    // 현재 필터에 해당하는, 장소가 표시된 일정들
    function placedItems() {
      const rows = [];
      trip.days.forEach((day, d) => {
        if (ui.mapFilter !== 'all' && ui.mapFilter !== d) return;
        day.items.forEach((item, i) => {
          if (item.place) rows.push({ d, no: itemNo(d, i), item });
        });
      });
      return rows;
    }

    // 지도 아래 장소 목록 (지도가 안 뜰 때도 마크한 장소를 확인할 수 있게)
    function renderMapList() {
      const list = document.getElementById('map-list');
      const rows = placedItems();
      document.getElementById('map-list-title').textContent =
        `${ui.mapFilter === 'all' ? '전체' : `${ui.mapFilter + 1}일차`} 장소 ${rows.length}곳`;
      if (rows.length === 0) {
        list.replaceChildren(el('li', { className: 'empty' }, [
          el('strong', { textContent: '표시한 장소가 없어요' }),
          '일정표에서 일정을 눌러 장소를 표시해 보세요.',
        ]));
        return;
      }
      list.replaceChildren(...rows.map(({ d, no, item }) => el('li', { className: `item place-row${item.visited ? ' visited' : ''}` }, [
        el('div', { className: 'main' }, [
          el('button', { type: 'button', className: 'body', onclick: () => focusMarker(item.id) }, [
            noBadge(no, d),
            el('span', { className: 'text' }, [
              el('span', { className: 'title', textContent: item.place.name }),
              el('span', { className: 'meta', textContent: `${item.time || '시간 미정'} · ${item.title}${item.visited ? ' · 다녀옴' : ''}` }),
            ]),
          ]),
          el('span', { className: 'go', 'aria-hidden': 'true' }, icon('chevron')),
        ]),
      ])));
    }

    // ── 구글맵 불러오기 ──────────────────────────────
    const maps = {
      status: GOOGLE_MAPS_API_KEY ? 'idle' : 'nokey', // idle | loading | ready | error | nokey
      promise: null,
      main: null,          // 지도 페이지의 지도
      mainOverlays: [],    // 지도 페이지의 마커·선 (다시 그릴 때 지움)
      markerById: {},
      info: null,
      picker: null,        // 장소 고르기 시트의 지도
    };

    const MAP_MESSAGES = {
      nokey: '지도 준비 중이에요.\n구글맵 API 키를 넣으면 지도가 나와요.',
      loading: '지도를 불러오는 중이에요…',
      error: '지도를 불러오지 못했어요.\nVPN이 켜져 있는지 확인한 뒤\n페이지를 새로고침해 주세요.\n\n일정표는 그대로 쓸 수 있어요.',
    };

    function showMapMessage(id, status) {
      const box = document.getElementById(id);
      box.hidden = status === 'ready';
      box.replaceChildren(icon('map'), MAP_MESSAGES[status] || '');
    }

    function loadGoogleMaps() {
      if (maps.status === 'nokey') return Promise.reject(new Error('API 키 없음'));
      if (maps.promise) return maps.promise;
      maps.status = 'loading';
      maps.promise = new Promise((resolve, reject) => {
        const fail = (err) => {
          maps.status = 'error';
          updateMapMessages();
          reject(err);
        };
        window.gm_authFailure = () => fail(new Error('API 키 인증 실패 (키 제한 주소를 확인하세요)'));
        window.__onGoogleMapsReady = async () => {
          try {
            await Promise.all(['maps', 'marker', 'places'].map((lib) => google.maps.importLibrary(lib)));
            maps.status = 'ready';
            updateMapMessages();
            resolve();
          } catch (err) { fail(err); }
        };
        const params = new URLSearchParams({
          key: GOOGLE_MAPS_API_KEY,
          v: 'weekly',
          loading: 'async',
          language: 'ko',
          callback: '__onGoogleMapsReady',
        });
        const script = el('script', { src: `https://maps.googleapis.com/maps/api/js?${params}`, async: true });
        script.onerror = () => fail(new Error('구글맵 스크립트를 불러오지 못함'));
        document.head.append(script);
      });
      updateMapMessages();
      return maps.promise;
    }

    function updateMapMessages() {
      showMapMessage('main-map-msg', maps.status);
      showMapMessage('picker-map-msg', maps.status);
    }

    function newMap(container, options = {}) {
      return new google.maps.Map(container, {
        center: SHANGHAI,
        zoom: 11,
        mapId: 'DEMO_MAP_ID', // 번호 마커(AdvancedMarkerElement)에 필요
        clickableIcons: true,
        streetViewControl: false,
        mapTypeControl: false,
        fullscreenControl: false,
        gestureHandling: 'greedy', // 한 손가락으로 지도 이동
        ...options,
      });
    }

    function markerElement(label, color, visited) {
      return el('div', {
        className: `marker${visited ? ' visited' : ''}`,
        textContent: label,
        style: { background: color },
      });
    }

    // 구글맵 앱(또는 웹)에서 길찾기
    function directionsUrl(place) {
      const params = new URLSearchParams({ api: '1', destination: `${place.lat},${place.lng}` });
      if (place.placeId) params.set('destination_place_id', place.placeId);
      return `https://www.google.com/maps/dir/?${params}`;
    }

    // 지도 페이지의 지도: 페이지가 처음 보일 때 만들고, 데이터가 바뀌면 다시 그립니다.
    let mainMapNeedsFit = true;
    function renderMainMap() {
      if (ui.page !== 'map') return;
      if (maps.status !== 'ready') {
        updateMapMessages();
        if (maps.status === 'idle') loadGoogleMaps().then(render).catch((e) => console.warn(e));
        return;
      }
      if (!maps.main) {
        maps.main = newMap(document.getElementById('main-map'));
        maps.info = new google.maps.InfoWindow();
      }
      drawMainOverlays();
      if (mainMapNeedsFit) fitMainMap();
    }

    function drawMainOverlays() {
      maps.mainOverlays.forEach((o) => (o.setMap ? o.setMap(null) : (o.map = null)));
      maps.mainOverlays = [];
      maps.markerById = {};

      const rows = placedItems();
      // F8: 일차별 동선 선 (일정 순서대로)
      const byDay = {};
      rows.forEach((r) => (byDay[r.d] ||= []).push(r));
      for (const [d, dayRows] of Object.entries(byDay)) {
        if (dayRows.length < 2) continue;
        maps.mainOverlays.push(new google.maps.Polyline({
          map: maps.main,
          path: dayRows.map((r) => ({ lat: r.item.place.lat, lng: r.item.place.lng })),
          strokeColor: dayColor(Number(d)),
          strokeOpacity: 0.75,
          strokeWeight: 4,
        }));
      }
      // F5: 1-1, 1-2 … 번호 마커
      for (const { d, no, item } of rows) {
        const marker = new google.maps.marker.AdvancedMarkerElement({
          map: maps.main,
          position: { lat: item.place.lat, lng: item.place.lng },
          content: markerElement(no, dayColor(d), item.visited),
          title: `${no} ${item.title}`,
        });
        marker.addListener('click', () => openInfo(marker, no, item));
        maps.mainOverlays.push(marker);
        maps.markerById[item.id] = { marker, no, item };
      }
    }

    // F9: 마커 정보창 + 길찾기 버튼
    function openInfo(marker, no, item) {
      const content = el('div', { className: 'info' }, [
        el('div', { className: 'info-title', textContent: `${no} · ${item.title}` }),
        el('div', { textContent: item.time || '시간 미정' }),
        el('div', { className: 'info-place', textContent: item.place.name }),
        el('a', { href: directionsUrl(item.place), target: '_blank', rel: 'noopener', textContent: '구글맵에서 길찾기' }),
      ]);
      maps.info.setContent(content);
      maps.info.open({ map: maps.main, anchor: marker });
    }

    function focusMarker(id) {
      const m = maps.markerById[id];
      if (!m) return;
      maps.main.panTo(m.marker.position);
      maps.main.setZoom(Math.max(maps.main.getZoom(), 15));
      openInfo(m.marker, m.no, m.item);
      document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 현재 필터의 장소가 모두 보이게 화면 맞춤
    function fitMainMap() {
      if (!maps.main) { mainMapNeedsFit = true; return; }
      mainMapNeedsFit = false;
      maps.info?.close();
      const rows = placedItems();
      if (rows.length === 0) {
        maps.main.setCenter(SHANGHAI);
        maps.main.setZoom(11);
      } else if (rows.length === 1) {
        maps.main.setCenter({ lat: rows[0].item.place.lat, lng: rows[0].item.place.lng });
        maps.main.setZoom(15);
      } else {
        const bounds = new google.maps.LatLngBounds();
        rows.forEach((r) => bounds.extend({ lat: r.item.place.lat, lng: r.item.place.lng }));
        maps.main.fitBounds(bounds, 56);
      }
    }

    // ── 장소 고르기 시트 (F4) ────────────────────────
    const picker = {
      itemId: null,
      chosen: null,   // { name, lat, lng, placeId }
      marker: null,
      search: null,
    };

    function openPicker(id) {
      const found = findItem(id);
      if (!found) return;
      picker.itemId = id;
      picker.chosen = found.item.place ? { ...found.item.place } : null;
      const eyebrow = document.getElementById('picker-eyebrow');
      eyebrow.textContent = `${itemNo(found.d, found.i)} · ${found.item.time || '시간 미정'}`;
      eyebrow.style.color = dayColor(found.d);
      document.getElementById('picker-title').textContent = `${found.item.title} 장소 표시`;
      document.getElementById('picker').hidden = false;
      updatePickerFooter();
      updateMapMessages();
      loadGoogleMaps()
        .then(setupPickerMap)
        .catch((e) => console.warn(e));
    }

    function closePicker() {
      document.getElementById('picker').hidden = true;
      picker.itemId = null;
    }

    function updatePickerFooter() {
      const found = picker.itemId && findItem(picker.itemId);
      const chosenBox = document.getElementById('picker-chosen');
      chosenBox.classList.toggle('has', !!picker.chosen);
      chosenBox.replaceChildren(...(picker.chosen
        ? [icon('pin'), picker.chosen.name]
        : ['아직 고른 장소가 없어요']));
      document.getElementById('picker-save').disabled = !picker.chosen;
      document.getElementById('picker-clear').disabled = !(found && found.item.place);
    }

    function setupPickerMap() {
      if (!picker.itemId) return; // 불러오는 사이 시트를 닫은 경우
      if (!maps.picker) {
        maps.picker = newMap(document.getElementById('picker-map'));
        maps.picker.addListener('click', onPickerMapClick);
        picker.search = createPlaceSearch();
        if (picker.search) document.getElementById('picker-search').append(picker.search);
      }
      if (picker.search) picker.search.value = '';
      showChosenOnPicker(true);
    }

    // 장소 검색창 (Places API (New) 자동완성). 중국 안의 장소만, 상하이 근처를 먼저 보여줍니다.
    function createPlaceSearch() {
      try {
        const { PlaceAutocompleteElement } = google.maps.places;
        let search;
        try {
          search = new PlaceAutocompleteElement({
            includedRegionCodes: ['cn'],
            locationBias: { center: SHANGHAI, radius: 50000 },
          });
        } catch {
          search = new PlaceAutocompleteElement();
        }
        search.placeholder = '장소 검색 (예: 예원, The Bund, 豫园)';
        const choose = async (place) => {
          await place.fetchFields({ fields: ['displayName', 'location', 'id'] });
          picker.chosen = {
            name: place.displayName,
            lat: place.location.lat(),
            lng: place.location.lng(),
            placeId: place.id,
          };
          showChosenOnPicker(true);
        };
        // 최신 이벤트(gmp-select)와 이전 이벤트(gmp-placeselect)를 모두 받습니다.
        search.addEventListener('gmp-select', (e) => choose(e.placePrediction.toPlace()).catch(console.warn));
        search.addEventListener('gmp-placeselect', (e) => choose(e.place).catch(console.warn));
        return search;
      } catch (e) {
        console.warn('장소 검색창을 만들지 못했습니다. 지도를 눌러 고를 수 있어요.', e);
        return null;
      }
    }

    // 지도를 눌러 고르기. 가게·명소 아이콘을 누르면 그 이름을 가져옵니다.
    async function onPickerMapClick(e) {
      const found = findItem(picker.itemId);
      if (!found) return;
      const lat = e.latLng.lat();
      const lng = e.latLng.lng();
      if (e.placeId) {
        e.stop(); // 구글 기본 정보창 대신 우리 선택으로 처리
        try {
          const place = new google.maps.places.Place({ id: e.placeId, requestedLanguage: 'ko' });
          await place.fetchFields({ fields: ['displayName', 'location'] });
          picker.chosen = { name: place.displayName, lat, lng, placeId: e.placeId };
        } catch {
          picker.chosen = { name: found.item.title, lat, lng, placeId: e.placeId };
        }
      } else {
        picker.chosen = { name: found.item.title, lat, lng, placeId: null };
      }
      showChosenOnPicker(false);
    }

    function showChosenOnPicker(moveMap) {
      updatePickerFooter();
      if (!maps.picker) return;
      if (picker.marker) picker.marker.map = null;
      picker.marker = null;
      if (!picker.chosen) {
        if (moveMap) { maps.picker.setCenter(SHANGHAI); maps.picker.setZoom(11); }
        return;
      }
      const pos = { lat: picker.chosen.lat, lng: picker.chosen.lng };
      const found = findItem(picker.itemId);
      picker.marker = new google.maps.marker.AdvancedMarkerElement({
        map: maps.picker,
        position: pos,
        content: el('div', {
          className: 'marker pick',
          textContent: found ? itemNo(found.d, found.i) : '•',
          style: found ? { background: dayColor(found.d) } : {},
        }),
      });
      if (moveMap) { maps.picker.setCenter(pos); maps.picker.setZoom(16); }
    }

    function savePickedPlace() {
      const found = findItem(picker.itemId);
      if (!found || !picker.chosen) return;
      found.item.place = { ...picker.chosen };
      mainMapNeedsFit = true;
      closePicker();
      commit('장소를 표시했어요');
    }

    function clearPickedPlace() {
      const found = findItem(picker.itemId);
      if (!found || !found.item.place) return;
      if (!confirm('이 일정에 표시한 장소를 지울까요?')) return;
      found.item.place = null;
      mainMapNeedsFit = true;
      closePicker();
      commit('장소를 지웠어요');
    }

    // ── 백업 저장 / 불러오기 (F10) ───────────────────
    function exportTrip() {
      const now = new Date();
      const stamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
      const blob = new Blob([JSON.stringify(trip, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = el('a', { href: url, download: `상하이일정-${stamp}.json` });
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('백업 파일을 저장했어요');
    }

    function importTrip(file) {
      const reader = new FileReader();
      reader.onload = () => {
        let data;
        try { data = JSON.parse(reader.result); } catch { data = null; }
        if (!isValidTrip(data)) {
          alert('일정 백업 파일이 아니에요. 백업 저장으로 만든 파일을 골라 주세요.');
          return;
        }
        if (!confirm('지금 일정을 이 파일의 일정으로 바꿀까요?\n(지금 일정은 사라져요)')) return;
        trip = data;
        ui.day = 0;
        ui.mapFilter = 'all';
        ui.editingId = null;
        mainMapNeedsFit = true;
        commit('일정을 불러왔어요');
      };
      reader.readAsText(file);
    }

    // ── 홈 화면 아이콘 (F11) ─────────────────────────
    // iOS는 PNG 아이콘만 쓰므로, 캔버스로 그려서 넣습니다.
    function setupHomeIcon() {
      try {
        const size = 180;
        const c = el('canvas', { width: size, height: size });
        const g = c.getContext('2d');
        g.fillStyle = '#4154FF';
        g.fillRect(0, 0, size, size);
        g.fillStyle = '#fff';
        g.beginPath();
        g.moveTo(90, 148);
        g.bezierCurveTo(90, 148, 44, 104, 44, 76);
        g.arc(90, 76, 46, Math.PI, 0);
        g.bezierCurveTo(136, 104, 90, 148, 90, 148);
        g.fill();
        g.fillStyle = '#4154FF';
        g.beginPath();
        g.arc(90, 76, 17, 0, Math.PI * 2);
        g.fill();
        document.head.append(el('link', { rel: 'apple-touch-icon', href: c.toDataURL('image/png') }));
      } catch (e) {
        console.warn('홈 화면 아이콘을 만들지 못했습니다.', e);
      }
    }

    // ── 이벤트 ───────────────────────────────────────
    const navButtons = document.querySelectorAll('nav.bottom button');
    navButtons[0].replaceChildren(icon('list'), '일정표');
    navButtons[1].replaceChildren(icon('map'), '지도');
    navButtons.forEach((b) => {
      b.addEventListener('click', () => {
        ui.page = b.dataset.page;
        ui.editingId = null;
        render();
        document.querySelector('main').scrollTo({ top: 0 });
      });
    });
    document.getElementById('picker-close').replaceChildren(icon('close'));
    document.getElementById('add-item').addEventListener('click', () => { ui.editingId = 'new'; render(); });
    document.getElementById('remove-day').addEventListener('click', removeLastDay);
    document.getElementById('picker-close').addEventListener('click', closePicker);
    document.getElementById('picker-save').addEventListener('click', savePickedPlace);
    document.getElementById('picker-clear').addEventListener('click', clearPickedPlace);
    document.getElementById('export-btn').addEventListener('click', exportTrip);
    document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
    document.getElementById('import-file').addEventListener('change', (e) => {
      if (e.target.files[0]) importTrip(e.target.files[0]);
      e.target.value = '';
    });

    setupHomeIcon();
    render();
  </script>
</body>
</html>
